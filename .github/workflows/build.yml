name: Build Android + iOS

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar plataformas
        run: |
          flutter create --org com.dfsolutions --project-name teccheck --platforms android,ios .
          dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TecCheck-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar plataformas
        run: |
          flutter create --org com.dfsolutions --project-name teccheck --platforms android,ios .
          dart run tool/setup.dart
      - run: flutter pub get
      # Compila sem assinatura só para validar o código iOS.
      # Para instalar no iPhone é preciso assinar no Xcode com uma conta Apple.
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qr Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: TecCheck-ios-unsigned
          path: build/ios/iphoneos/Runner-unsigned.zip
