name: teccheck_native
description: Recursos nativos de rede do TecCheck (ICMP, Wi-Fi, permissões).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.dfsolutions.teccheck_native
        pluginClass: TecCheckNativePlugin
      ios:
        pluginClass: TecCheckNativePlugin
