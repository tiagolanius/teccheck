name: teccheck
description: Checagem técnica na casa do cliente para técnicos de telecom.
publish_to: none
version: 2.2.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  teccheck_native:
    path: packages/teccheck_native
  network_info_plus: ^6.1.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
